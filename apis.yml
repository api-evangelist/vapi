aid: vapi
url: https://raw.githubusercontent.com/api-evangelist/vapi/refs/heads/main/apis.yml
name: Vapi
kind: company
description: Vapi is a voice AI agents platform for building, testing, and deploying real-time voice agents across phone,
  web, and SIP. The Vapi REST API exposes assistants, calls, chats, campaigns, phone numbers, tools, files, squads, sessions,
  structured outputs, and analytics, plus server/client webhook events. A published OpenAPI spec is available at https://api.vapi.ai/api-json.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - AI
  - Voice
  - Agents
  - Realtime
  - CPaaS
created: '2026-05-08'
modified: '2026-05-19'
specificationVersion: '0.19'

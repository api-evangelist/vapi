    name: Vapi Platform API
    description: REST API for managing Vapi voice AI agents. Supports CRUD on Assistants, Squads, Calls, Chats, Campaigns, Sessions,
      Phone Numbers, Tools, Files, Structured Outputs, Insight, Eval, Observability, and Analytics. Auth is bearer token; base
      URL is https://api.vapi.ai.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg

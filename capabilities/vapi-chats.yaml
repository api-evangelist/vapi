naftiko: 1.0.0-alpha2
info:
  label: Vapi API — Chats
  description: 'Vapi API — Chats. 5 operations. Lead operation: List Chats. Self-contained Naftiko capability covering one
    Vapi business surface.'
  tags:
  - Vapi
  - Chats
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VAPI_API_KEY: VAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: vapi-chats
    baseUri: https://api.vapi.ai
    description: Vapi API — Chats business capability. Self-contained, no shared references.
    resources:
    - name: chat
      path: /chat
      operations:
      - name: chatcontrollerlistchats
        method: GET
        description: List Chats
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: This is the unique identifier for the chat to filter by.
        - name: assistantId
          in: query
          type: string
          description: This is the unique identifier for the assistant that will be used for the chat.
        - name: assistantIdAny
          in: query
          type: string
          description: Filter by multiple assistant IDs. Provide as comma-separated values.
        - name: squadId
          in: query
          type: string
          description: This is the unique identifier for the squad that will be used for the chat.
        - name: sessionId
          in: query
          type: string
          description: This is the unique identifier for the session that will be used for the chat.
        - name: previousChatId
          in: query
          type: string
          description: This is the unique identifier for the previous chat to filter by.
        - name: page
          in: query
          type: number
          description: This is the page number to return. Defaults to 1.
        - name: sortOrder
          in: query
          type: string
          description: This is the sort order for pagination. Defaults to 'DESC'.
        - name: sortBy
          in: query
          type: string
          description: This is the column to sort by. Defaults to 'createdAt'.
        - name: limit
          in: query
          type: number
          description: This is the maximum number of items to return. Defaults to 100.
        - name: createdAtGt
          in: query
          type: string
          description: This will return items where the createdAt is greater than the specified value.
        - name: createdAtLt
          in: query
          type: string
          description: This will return items where the createdAt is less than the specified value.
        - name: createdAtGe
          in: query
          type: string
          description: This will return items where the createdAt is greater than or equal to the specified value.
        - name: createdAtLe
          in: query
          type: string
          description: This will return items where the createdAt is less than or equal to the specified value.
        - name: updatedAtGt
          in: query
          type: string
          description: This will return items where the updatedAt is greater than the specified value.
        - name: updatedAtLt
          in: query
          type: string
          description: This will return items where the updatedAt is less than the specified value.
        - name: updatedAtGe
          in: query
          type: string
          description: This will return items where the updatedAt is greater than or equal to the specified value.
        - name: updatedAtLe
          in: query
          type: string
          description: This will return items where the updatedAt is less than or equal to the specified value.
      - name: chatcontrollercreatechat
        method: POST
        description: Create Chat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: chat-responses
      path: /chat/responses
      operations:
      - name: chatcontrollercreateopenaichat
        method: POST
        description: Create Chat (OpenAI Compatible)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: chat-id
      path: /chat/{id}
      operations:
      - name: chatcontrollergetchat
        method: GET
        description: Get Chat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: chatcontrollerdeletechat
        method: DELETE
        description: Delete Chat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.VAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: vapi-chats-rest
    port: 8080
    description: REST adapter for Vapi API — Chats. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/chat
      name: chat
      description: REST surface for chat.
      operations:
      - method: GET
        name: chatcontrollerlistchats
        description: List Chats
        call: vapi-chats.chatcontrollerlistchats
        with:
          id: rest.id
          assistantId: rest.assistantId
          assistantIdAny: rest.assistantIdAny
          squadId: rest.squadId
          sessionId: rest.sessionId
          previousChatId: rest.previousChatId
          page: rest.page
          sortOrder: rest.sortOrder
          sortBy: rest.sortBy
          limit: rest.limit
          createdAtGt: rest.createdAtGt
          createdAtLt: rest.createdAtLt
          createdAtGe: rest.createdAtGe
          createdAtLe: rest.createdAtLe
          updatedAtGt: rest.updatedAtGt
          updatedAtLt: rest.updatedAtLt
          updatedAtGe: rest.updatedAtGe
          updatedAtLe: rest.updatedAtLe
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: chatcontrollercreatechat
        description: Create Chat
        call: vapi-chats.chatcontrollercreatechat
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chat/responses
      name: chat-responses
      description: REST surface for chat-responses.
      operations:
      - method: POST
        name: chatcontrollercreateopenaichat
        description: Create Chat (OpenAI Compatible)
        call: vapi-chats.chatcontrollercreateopenaichat
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chat/{id}
      name: chat-id
      description: REST surface for chat-id.
      operations:
      - method: GET
        name: chatcontrollergetchat
        description: Get Chat
        call: vapi-chats.chatcontrollergetchat
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: chatcontrollerdeletechat
        description: Delete Chat
        call: vapi-chats.chatcontrollerdeletechat
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vapi-chats-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vapi API — Chats. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-chats
      description: List Chats
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vapi-chats.chatcontrollerlistchats
      with:
        id: tools.id
        assistantId: tools.assistantId
        assistantIdAny: tools.assistantIdAny
        squadId: tools.squadId
        sessionId: tools.sessionId
        previousChatId: tools.previousChatId
        page: tools.page
        sortOrder: tools.sortOrder
        sortBy: tools.sortBy
        limit: tools.limit
        createdAtGt: tools.createdAtGt
        createdAtLt: tools.createdAtLt
        createdAtGe: tools.createdAtGe
        createdAtLe: tools.createdAtLe
        updatedAtGt: tools.updatedAtGt
        updatedAtLt: tools.updatedAtLt
        updatedAtGe: tools.updatedAtGe
        updatedAtLe: tools.updatedAtLe
      outputParameters:
      - type: object
        mapping: $.
    - name: create-chat
      description: Create Chat
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: vapi-chats.chatcontrollercreatechat
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: create-chat-openai-compatible
      description: Create Chat (OpenAI Compatible)
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: vapi-chats.chatcontrollercreateopenaichat
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-chat
      description: Get Chat
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vapi-chats.chatcontrollergetchat
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-chat
      description: Delete Chat
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: vapi-chats.chatcontrollerdeletechat
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: Vapi API — Calls
  description: 'Vapi API — Calls. 5 operations. Lead operation: Create Call. Self-contained Naftiko capability covering one
    Vapi business surface.'
  tags:
  - Vapi
  - Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VAPI_API_KEY: VAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: vapi-calls
    baseUri: https://api.vapi.ai
    description: Vapi API — Calls business capability. Self-contained, no shared references.
    resources:
    - name: call
      path: /call
      operations:
      - name: callcontrollercreate
        method: POST
        description: Create Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: callcontrollerfindall
        method: GET
        description: List Calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: This is the unique identifier for the call.
        - name: assistantId
          in: query
          type: string
          description: This will return calls with the specified assistantId.
        - name: phoneNumberId
          in: query
          type: string
          description: This is the phone number that will be used for the call. To use a transient number, use `phoneNumber`
            instead.
        - name: limit
          in: query
          type: number
          description: This is the maximum number of items to return. Defaults to 100.
        - name: createdAtGt
          in: query
          type: string
          description: This will return items where the createdAt is greater than the specified value.
        - name: createdAtLt
          in: query
          type: string
          description: This will return items where the createdAt is less than the specified value.
        - name: createdAtGe
          in: query
          type: string
          description: This will return items where the createdAt is greater than or equal to the specified value.
        - name: createdAtLe
          in: query
          type: string
          description: This will return items where the createdAt is less than or equal to the specified value.
        - name: updatedAtGt
          in: query
          type: string
          description: This will return items where the updatedAt is greater than the specified value.
        - name: updatedAtLt
          in: query
          type: string
          description: This will return items where the updatedAt is less than the specified value.
        - name: updatedAtGe
          in: query
          type: string
          description: This will return items where the updatedAt is greater than or equal to the specified value.
        - name: updatedAtLe
          in: query
          type: string
          description: This will return items where the updatedAt is less than or equal to the specified value.
    - name: call-id
      path: /call/{id}
      operations:
      - name: callcontrollerfindone
        method: GET
        description: Get Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: callcontrollerupdate
        method: PATCH
        description: Update Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: callcontrollerdeletecalldata
        method: DELETE
        description: Delete Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true

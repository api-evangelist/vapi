naftiko: 1.0.0-alpha2
info:
  label: Vapi API — Files
  description: 'Vapi API — Files. 5 operations. Lead operation: Upload File. Self-contained Naftiko capability covering one
    Vapi business surface.'
  tags:
  - Vapi
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VAPI_API_KEY: VAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: vapi-files
    baseUri: https://api.vapi.ai
    description: Vapi API — Files business capability. Self-contained, no shared references.
    resources:
    - name: file
      path: /file
      operations:
      - name: filecontrollercreate
        method: POST
        description: Upload File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: filecontrollerfindall
        method: GET
        description: List Files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: file-id
      path: /file/{id}
      operations:
      - name: filecontrollerfindone
        method: GET
        description: Get File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: filecontrollerupdate
        method: PATCH
        description: Update File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: filecontrollerremove
        method: DELETE
        description: Delete File
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.VAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: vapi-files-rest
    port: 8080
    description: REST adapter for Vapi API — Files. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/file
      name: file
      description: REST surface for file.
      operations:
      - method: POST
        name: filecontrollercreate
        description: Upload File
        call: vapi-files.filecontrollercreate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: filecontrollerfindall
        description: List Files
        call: vapi-files.filecontrollerfindall
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/file/{id}
      name: file-id
      description: REST surface for file-id.
      operations:
      - method: GET
        name: filecontrollerfindone
        description: Get File
        call: vapi-files.filecontrollerfindone
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: filecontrollerupdate
        description: Update File
        call: vapi-files.filecontrollerupdate
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: filecontrollerremove
        description: Delete File
        call: vapi-files.filecontrollerremove
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: vapi-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vapi API — Files. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: upload-file
      description: Upload File
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: vapi-files.filecontrollercreate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-files
      description: List Files
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vapi-files.filecontrollerfindall
      outputParameters:
      - type: object
        mapping: $.
    - name: get-file
      description: Get File
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: vapi-files.filecontrollerfindone
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-file
      description: Update File
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: vapi-files.filecontrollerupdate
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-file
      description: Delete File
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: vapi-files.filecontrollerremove
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.

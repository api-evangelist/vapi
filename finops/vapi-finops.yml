description: >-
  FOCUS-aligned FinOps view of Vapi. Vapi's billing model is consumption-based per minute of
  voice agent runtime, with pass-through component costs for transcription, LLM, TTS, and
  telephony. Total cost ownership requires tracking each provider in the stack.
notes: Cost optimization on Vapi often means rightsizing the LLM/voice provider stack rather than the Vapi platform fee itself.

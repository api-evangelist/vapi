principles:
- name: Visibility
  description: Use Vapi call analytics plus underlying provider invoices to assemble total cost per call.
- name: Allocation
  description: Tag assistants and phone numbers to business units so call charges can be split in your FinOps store.
- name: Optimization
  description: Cheaper LLM and TTS providers usually drive far more savings than negotiating the Vapi platform fee.
- name: Accountability
  description: Assign owners for each component vendor (LLM, STT, TTS, telephony) since Vapi pass-through pricing depends on those contracts.

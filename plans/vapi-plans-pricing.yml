specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Vapi
providerId: vapi
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- AI
- Voice
- Agents
- Realtime
- CPaaS
- Plans
description: >-
  Vapi prices its voice AI agent platform on a per-minute usage basis. The headline platform
  fee is roughly $0.05/min on top of pass-through costs for transcription, LLM, TTS, and
  telephony. Real-world all-in cost typically lands between $0.07 and $0.25/min depending on
  model and provider choices. Enterprise plans are negotiated.
notes: Pricing is reconciled from Vapi's public pricing page and third-party reviews; verify exact rates with the provider before contracting.
sources:
- https://vapi.ai/pricing
- https://docs.vapi.ai/
plans:
- id: vapi-pay-as-you-go
  name: Pay-as-you-go
  type: usage
  description: Per-minute platform fee with pass-through component pricing for transcription, LLM, TTS, and telephony.
  entries:
  - label: Vapi Platform Fee
    name: platform_fee
    type: per_minute
    metric: minute
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.05 USD/min (orchestration only)
    userMultiplied: false
  - label: All-in Realistic Cost
    name: all_in_per_minute
    type: per_minute
    metric: minute
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.07 - 0.25 USD/min (varies by provider stack)
    userMultiplied: false
  elements:
  - name: Assistants, Calls, Phone Numbers, Tools
  - name: Server/client webhooks
- id: vapi-enterprise
  name: Enterprise
  type: enterprise
  description: Custom pricing with volume discounts, dedicated support, and SLAs.
  entries:
  - label: Enterprise Contract
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: SLA
  - name: Volume discounts
  - name: Dedicated support
